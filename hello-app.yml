resource "kubernetes_deployment_v1" "hello" {
  metadata {
    name = "hello-app"
  }
  spec {
    replicas = var.replicas
    selector {
      match_labels = {
        app = "hello-app"
      }
    }
    template {
      metadata {
        labels = {
          app = "hello-app"
        }
      }
      spec {
        container {
          name  = "hello-app"
          image = "shripada/hello-app:${var.image_tag}"
          port {
            container_port = 80
          }
        }
      }
    }
  }
}

resource "kubernetes_service_v1" "hello" {
  metadata {
    name = "hello-app"
  }
  spec {
    type = "LoadBalancer"
    selector = {
      app = "hello-app"
    }
    port {
      port        = var.port
      target_port = 80
    }
  }
}

output "url" {
  value = "http://localhost:${var.port}"
}